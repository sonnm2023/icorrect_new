# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.2
  http: ^0.13.5 #call api
  shared_preferences: ^2.1.0 #shared reference
  device_info: ^2.0.0 # device info
  path_provider: ^2.0.14 
  provider: ^6.0.5 #provider for state management
  video_player: ^2.8.6
  video_player_win: ^2.3.7
  video_player_macos: ^2.0.1
  sqflite: ^2.3.3 #database local
  sqflite_common_ffi: ^2.3.3
  device_info_plus: ^9.0.2
  package_info_plus: ^4.0.2
 
  dashed_circular_progress_bar: ^0.0.4
  path: ^1.8.2 
  audioplayers: ^6.0.0
  image: ^4.0.17
  permission_handler: ^10.2.0
  flutter_local_notifications: ^13.0.0
  window_manager: ^0.2.7
  loading_animation_widget: ^1.2.0+4
  flutter_desktop_audio_recorder: ^0.0.1 

  cached_network_image: ^3.2.2
  fluttertoast: ^8.0.9
  intl: ^0.19.0
  record: ^4.4.4
  sizer: ^2.0.15
  image_picker: ^0.8.5+3
  smooth_page_indicator: ^1.0.0+2
  get_it: ^7.2.0
  flutter_typeahead: ^4.1.1
  flutter_launcher_icons: ^0.13.1
  carousel_slider: ^4.0.0
  grouped_list: ^5.1.2
  connectivity_plus: ^4.0.1 
  dio: ^5.3.2
#  webview_cef: ^0.1.0
  camera_windows: ^0.2.1+8
  #ffmpeg_wasm: ^1.0.1
  ffmpeg_cli: ^0.2.0
  shimmer: ^3.0.0
  dotted_border: ^2.1.0
  flutter_localization: ^0.1.14
  internet_connection_checker: ^1.0.0+1
  webview_flutter: ^4.8.0
  webview_windows: ^0.4.0
  flutter_audio_waveforms: ^1.2.1+8

  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
